[project]
name = "m5-petit-voice-recognition"
version = "0.3.0"
description = "GPU mini PC voice recognition, sound classification, and voice feature extraction server for M5 petit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.10.1",
  "faster-whisper>=1.2.0",
  "soundfile>=0.13.1",
  "numpy>=2.0.0",
  "librosa>=0.11.0",
  "praat-parselmouth>=0.4.7",
  "opensmile>=2.6.0",
  "resemblyzer>=0.1.1.dev0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1",
  "ruff>=0.12.10",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"