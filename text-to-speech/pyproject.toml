[project]
name = "text-to-speech"
version = "0.1.0"
description = "Japanese speech synthesis server"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "kokoro-onnx>=0.5.0",
  "soundfile>=0.13.1",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_speech"]
